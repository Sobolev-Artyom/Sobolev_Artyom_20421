services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:1234@db:5432/mydb
    depends_on:
      - db
    command: >
      sh -c "
             npx prisma migrate dev --name init &&
             npx prisma generate &&
             npm install -D typescript ts-node @types/node &&
             npx prisma db seed &&
             npm run dev"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - my_network
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_network
networks:
  my_network:
    external: false
volumes:
  postgres_data:
volumes:
  pgdata:
